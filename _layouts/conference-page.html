<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
    <!-- Conference Header with Logo and Title (matching Main Site) -->
    <header class="site-header">
        <div class="wrapper">
            <div class="header-content">
                <div class="site-title">
                    <a href="/">
                        {% if site.logo %}
                            <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="site-logo">
                        {% endif %}
                        <span class="title-text">{{ page.title }}</span>
                    </a>
                </div>
                
                <nav class="site-nav">
                    {% assign nav_items = site.conference_nav[page.year] %}
                    {% for item in nav_items %}
                        <a href="{{ item.url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.name }}</a>
                    {% endfor %}
                    <a href="/" class="main-site-link">Main Site</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{ page.year }} {{ site.title }} Conference. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
