<header class="site-header" role="banner">
  <div class="wrapper">
    <div class="header-content">
      <div class="site-title">
        <a href="{{ "/" | relative_url }}">
          {% if site.logo %}
            <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="site-logo">
          {% endif %}
          <span class="title-text">{{ site.title }}</span>
        </a>
      </div>
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}">Home</a>
        <a href="{{ "/2025/" | relative_url }}">2025</a>
        <a href="{{ "/2027/" | relative_url }}">2027</a>
      </nav>
    </div>
  </div>
</header>
