# Site settings
title: "Conference Series"
description: "Annual Conference on Innovation and Technology"
baseurl: ""
url: "https://pkcep.github.io/"  # Replace with your GitHub Pages URL

# Build settings
markdown: kramdown
theme: minima  # You can change this to any theme you like
plugins:
  - jekyll-feed

# Collections for future expansion
collections:
  conferences:
    output: true
    permalink: /:collection/:path/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default