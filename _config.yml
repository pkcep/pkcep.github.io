# Site settings
title: "Computing Education Practice in Pakistan"
description: "Conference on Computing Education Practice in Pakistan"
logo: "/assets/images/pkcep-logo-2025-v1.png"
baseurl: ""
url: "https://pkcep.github.io/"  # Replace with your GitHub Pages URL

# Build settings
markdown: kramdown
theme: minima  # You can change this to any theme you like
