# Site settings
title: "Computing Education Practice in Pakistan"
description: "Conference on Computing Education Practice in Pakistan"
logo: "/assets/images/pkcep-logo-2025-v1.png"
baseurl: ""
url: "https://pkcep.github.io/"  # Replace with your GitHub Pages URL

# Build settings
markdown: kramdown
theme: minima  # You can change this to any theme you like
plugins:
  - jekyll-feed

# Collections for future expansion
collections:
  conferences:
    output: true
    permalink: /:collection/:path/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      
# Year-specific navigation
conference_nav:
  2027:
    - name: "Home"
      url: "/2027/"
    - name: "Working Groups"
      url: "/2027/working-groups/"
    - name: "Organizers"
      url: "/2027/organizers/"      